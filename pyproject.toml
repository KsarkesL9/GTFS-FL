[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs-olap"
version = "0.1.0"
description = "Kostka OLAP dla strumieni danych transportu publicznego GZM Metropolia"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "loguru>=0.7.0",
    "gtfs-realtime-bindings>=1.0.0",
    # Interfejs do części uczeniowej (decyzja D3) i format archiwum na Drive.
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
# Część uczeniowa. Osobno, bo kolektor na VPS ich nie potrzebuje, a torch
# waży kilkaset megabajtów.
uczenie = [
    "torch>=2.0",
    "flwr>=1.8",
    "river>=0.21",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["gtfs_olap*"]
