services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: gtfs-tsdb
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Warsaw
    # UWAGA. Bind wyłącznie na pętlę zwrotną. Publikacja na 0.0.0.0 na VPS
    # z publicznym IP oznacza bazę wystawioną do internetu - dostęp z
    # laptopa/Power BI robi się tunelem SSH, nie otwartym portem.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /srv/gtfs/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Dostrojone pod 3,7 GB RAM. Kolektor potrzebuje ~800 MB na cache rozkładu,
    # więc Postgres nie może brać więcej niż ok. połowy tego, co zostaje.
    # Przy przesiadce na maszynę 8 GB podnieś shared_buffers do 2GB
    # i effective_cache_size do 4GB.
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=50
        -c max_wal_size=1GB
        -c timescaledb.max_background_workers=4
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  collector:
    build: .
    container_name: gtfs-collector
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    env_file: .env
    volumes:
      - /srv/gtfs/data:/data
    # SIGTERM jest obsłużony w rt.py, ale pętla domyka bieżącą iterację.
    # Domyślne 10 s bywa za mało, gdy trwa akurat reload cache'u.
    stop_grace_period: 30s
    command: python scripts/run_rt_etl.py
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}

  maintenance:
    build: .
    container_name: gtfs-maintenance
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    env_file: .env
    volumes:
      - /srv/gtfs/data:/data
      # KATALOG, nie pojedynczy plik. rclone przy odświeżaniu tokenu OAuth
      # zapisuje config przez rename (nowy plik -> backup starego), a
      # pojedynczy plik zamontowany bind-mountem jest punktem montowania,
      # którego nie da się przenieść: "device or resource busy".
      # Katalog ./secrets musi należeć do UID 10001 (użytkownik z Dockerfile).
      - ./secrets:/home/gtfs/.config/rclone
    # Ścieżka BEZWZGLĘDNA, nie samo "supercronic". Jako PID 1 supercronic
    # włącza reaping procesów potomnych i re-execuje sam siebie - a re-exec
    # nie przeszukuje PATH. Przy relatywnym argv[0] kończy się to natychmiast
    # "Failed to fork exec: no such file or directory" i pętlą restartów,
    # jeszcze przed wczytaniem crontaba.
    command: /usr/local/bin/supercronic /app/crontab
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "3"}
